name: Aggiorna listino prezzi

on:
  schedule:
    - cron: "30 6 * * 1-5"
    - cron: "30 16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

# Una corsa alla volta: due esecuzioni sovrapposte si contendono lo stesso file
# e finiscono in conflitto. Le altre aspettano invece di partire in parallelo.
concurrency:
  group: listino-prezzi
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aggiorna i prezzi
        run: python scripts/aggiorna.py

      - name: Pubblica le modifiche
        if: always()
        run: |
          git config user.name  "listino-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nessuna variazione: niente da pubblicare."
            exit 0
          fi
          git commit -m "prezzi $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Si prova il push per primo: nel caso normale finisce qui. Se il remoto
          # è andato avanti, si fonde tenendo la NOSTRA versione (-X ours), perché
          # prezzi.json è generato da zero e l'ultima produzione è quella giusta.
          # Niente rebase: su conflitto lascia il repository fuori dal ramo.
          for tentativo in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rifiutato, mi riallineo (tentativo $tentativo)"
            git pull --no-rebase --no-edit -X ours || true
          done
          echo "Push fallito dopo tre tentativi" >&2
          exit 1
