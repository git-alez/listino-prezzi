name: Aggiorna listino prezzi

on:
  schedule:
    - cron: "30 6 * * 1-5"
    - cron: "30 16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aggiorna i prezzi
        run: python scripts/aggiorna.py

      - name: Pubblica le modifiche
        if: always()
        run: |
          git config user.name  "listino-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nessuna variazione: niente da pubblicare."
          else
            git commit -m "prezzi $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash || true
            git push
          fi
